name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Force minSdk 24 and Override Cordova in AndroidManifest.xml
        run: |
          python3 -c '
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Garantir o namespace do tools
          if "xmlns:tools" not in content:
              content = content.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"")

          # 2. Se já existir uses-sdk, atualizar ou injetar o override e o minSdkVersion 24
          if "<uses-sdk" in content:
              content = re.sub(r"minSdkVersion\s*=\s*\"\d+\"", "minSdkVersion=\"24\"", content)
              if "tools:overrideLibrary" not in content:
                  content = content.replace("<uses-sdk", "<uses-sdk tools:overrideLibrary=\"org.apache.cordova\"")
          else:
              # Injetar o uses-sdk com override logo abaixo da tag <manifest>
              replacement = "<manifest>\n    <uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"36\" tools:overrideLibrary=\"org.apache.cordova\" />"
              content = re.sub(r"<manifest[^>]*>", replacement, content, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml patched successfully with minSdk 24 and Cordova override.")
          '

          # Garantir também o variables.gradle a 24
          cat << 'VAR_EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
          }
          VAR_EOF

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
