name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Inject tools:overrideLibrary to Bypass Cordova SDK Check
        run: |
          # Forçar minSdk 24 e injetar o override para ignorar o bloqueio do cordova
          python3 -c '
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Garantir namespace do tools
          if "xmlns:tools" not in content:
              content = content.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"")

          # Injetar <uses-sdk tools:overrideLibrary="org.apache.cordova" /> se nao existir
          if "tools:overrideLibrary" not in content:
              if "<application" in content:
                  content = content.replace("<application", "<uses-sdk tools:overrideLibrary=\"org.apache.cordova\" />\n    <application")
              else:
                  content = content.replace("</manifest>", "    <uses-sdk tools:overrideLibrary=\"org.apache.cordova\" />\n</manifest>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Cordova override injected successfully.")
          '

          # Assegurar variables.gradle a 24
          cat << 'VAR_EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
          }
          VAR_EOF

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
