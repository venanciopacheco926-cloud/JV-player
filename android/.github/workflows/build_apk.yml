name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Force minSdk 24 and Override Cordova constraints
        run: |
          # 1. Garantir variables.gradle com minSdkVersion = 24
          printf "ext {\n    minSdkVersion = 24\n    compileSdkVersion = 36\n    targetSdkVersion = 36\n}\n" > android/variables.gradle

          # 2. Injetar o minSdk 24 e o override no build.gradle do app
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Forçar minSdk 24 no defaultConfig
          content = content.replace("minSdk 22", "minSdk 24")
          content = content.replace("minSdkVersion 22", "minSdkVersion 24")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Forced minSdk 24 successfully.")
          '

          # 3. Adicionar o tools:overrideLibrary no AndroidManifest.xml se necessário para forçar o Cordova
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              m_content = f.read()

          if "xmlns:tools" not in m_content:
              m_content = m_content.replace("<manifest", "<manifest xmlns:tools=\"http://schemas.android.com/tools\"")

          if "tools:overrideLibrary" not in m_content and "<uses-sdk" in m_content:
              m_content = m_content.replace("<uses-sdk ", "<uses-sdk tools:overrideLibrary=\"org.apache.cordova\" ")
          elif "tools:overrideLibrary" not in m_content:
              # Se nao tiver uses-sdk explicito, injetar dentro de <manifest>
              m_content = m_content.replace("<manifest", "<manifest>\n    <uses-sdk tools:overrideLibrary=\"org.apache.cordova\"")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m_content)
          print("Cordova override injected into AndroidManifest.xml.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
