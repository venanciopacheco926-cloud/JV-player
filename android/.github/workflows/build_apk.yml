name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Force minSdk 24 AFTER Capacitor Sync
        run: |
          # Modificar diretamente o variables.gradle gerado pelo Capacitor para 24
          if [ -f "android/variables.gradle" ]; then
              sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          fi

          # Garantir que qualquer menção a minSdk 22 no build.gradle passa a 24
          python3 -c '
          import glob
          for path in glob.glob("android/**/build.gradle", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("minSdk 22", "minSdk 24").replace("minSdkVersion 22", "minSdkVersion 24")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          print("Post-sync minSdk 24 injection completed.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
