name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Force minSdk 24 in AndroidManifest.xml and Gradle
        run: |
          # 1. Injetar ou atualizar o uses-sdk com minSdkVersion 24 diretamente no AndroidManifest.xml
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          if "<uses-sdk" in content:
              import re
              content = re.sub(r"minSdkVersion\s*=\s*\"\d+\"", "minSdkVersion=\"24\"", content)
          else:
              # Injetar o uses-sdk logo abaixo da tag <manifest ...>
              content = content.replace("<manifest", "<manifest\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"")
              content = content.replace(">", ">\n    <uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"36\" />")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("AndroidManifest.xml updated to minSdk 24.")
          '

          # 2. Reforçar no variables.gradle
          cat << 'VAR_EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.11.0'
              androidxAppCompatVersion = '1.7.1'
              androidxCoreVersion = '1.17.0'
              androidxCustomtabsVersion = '1.3.0'
              androidxCoreSplashscreenVersion = '1.2.0'
              coreSplashScreenVersion = '1.2.0'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxFragmentVersion = '1.8.9'
              androidxWebkitVersion = '1.14.0'
              androidxAnnotationVersion = '1.4.1'
              androidxProfileinstallerVersion = '1.4.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          VAR_EOF

          # 3. Reforçar no app/build.gradle
          cat << 'BUILD_EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.jv.player"
              compileSdk 36

              defaultConfig {
                  applicationId "com.jv.player"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:1.7.1"
              implementation "androidx.core:core-ktx:1.17.0"
              implementation project(':capacitor-android')
              testImplementation 'junit:junit:4.13.2'
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
          }

          apply from: 'capacitor.build.gradle'
          try {
              apply from: '../capacitor-cordova-android-plugins/cordova.scripts.gradle'
          } catch (Exception e) {
              logger.info("cordova.scripts.gradle not found")
          }
          BUILD_EOF

          echo "All layers locked to minSdk 24."

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
