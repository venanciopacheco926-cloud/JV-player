<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JV Music 2.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#f0f0f5;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.band{position:relative;width:100%;flex:none}
.band img{display:block;width:100%}
#logo img{height:24vh;object-fit:contain;mix-blend-mode:screen}
:root{--dim:.5;--bg:url("img/bg.jpg")}
#stage{flex:1;min-height:0;display:flex;flex-direction:column}
#tab-player{background:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,calc(var(--dim) + .18))),var(--bg) center 20%/cover}
#viz{display:block;flex:none;width:100%;height:9vh}
#lyrics-container{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;text-align:center;scroll-behavior:smooth}
#info{position:absolute;left:40.5%;width:33%;top:27%;height:62%;display:flex;flex-direction:column;justify-content:space-around;font-size:3.7vw}
#info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t{font-weight:700;color:#fff}#a{color:#8fa8ff}#b{color:#6fd3ee}
#prog{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:3.6vw;font-weight:600}
#cur{color:#22d3ee}#dur{color:#ff2fa0}
.nr{-webkit-appearance:none;appearance:none;flex:1;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,#22d3ee,#ff2fa0);outline:none}
.nr::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#7fe9ff;box-shadow:0 0 8px #22d3ee,0 0 16px #22d3ee}
.hs{position:absolute;background:none;border:0;border-radius:22%}
.hs:active{background:rgba(255,255,255,.15)}
.hsw{position:absolute;display:flex;align-items:center}
#pp{position:absolute;left:50.3%;top:25.6%;width:13%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 0 6px #22d3ee)}
#pl{position:absolute;left:50.2%;top:57%;transform:translate(-50%,-50%);color:#d9b8ff;font-size:3.6vw;font-weight:600;pointer-events:none}
input[type=file]{display:none}
#library{display:none;position:fixed;inset:0;background:#05050a;flex-direction:column;padding:16px;z-index:10}
#library.open{display:flex}
.lib-top{display:flex;gap:8px;margin-bottom:10px}
#lib-search{flex:1;background:#12121c;color:#f0f0f5;border:1px solid #22d3ee;border-radius:8px;padding:10px;font-size:.9rem}
#lib-close,#lib-file{background:#12121c;color:#ff2fa0;border:1px solid #ff2fa0;border-radius:8px;padding:0 14px}
#lib-count{font-size:.75rem;color:#8a8aa8;margin-bottom:8px}
#lib-list{flex:1;overflow-y:auto}
.song{padding:10px 6px;border-bottom:1px solid #1f1f2e}
.song:active{background:#251a3a}
.song-title{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-sub{font-size:.75rem;color:#8a8aa8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-msg{padding:20px 6px;font-size:.85rem;color:#bbbbcc;line-height:1.5;white-space:pre-wrap;word-break:break-word}
#studio{display:none;flex:1;min-height:0;flex-direction:column;padding:12px 16px}
#studio.open{display:flex}
#st-title{flex:1;align-self:center;color:#22d3ee}
#pvbox{height:22vh;flex:none;border-radius:12px;overflow:hidden;margin-bottom:8px;border:1px solid #35354f;background:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,calc(var(--dim) + .18))),var(--bg) center/cover}
#pv{display:block;width:100%;height:100%}
#st-body{flex:1;overflow-y:auto}
.row{margin:14px 0}.row label{display:flex;justify-content:space-between;font-size:.8rem;color:#bbbbcc;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border:1px solid #35354f;border-radius:18px;font-size:.8rem;background:#12121c;color:#ddd}
.chip.on{border-color:#22d3ee;color:#fff;box-shadow:0 0 8px #22d3ee}
.chip:active{background:#251a3a}
input[type=color]{width:56px;height:34px;border:1px solid #35354f;border-radius:8px;background:#12121c;margin-right:10px}
.tab{display:none;flex:1;min-height:0;flex-direction:column}.tab.on{display:flex}
#tabs{display:flex;flex:none;background:#0b0b14;border-top:1px solid #35354f}
.tb{flex:1;padding:8px 0 7px;text-align:center;font-size:.72rem;color:#8a8aa8;border:0;border-top:2px solid transparent;background:none}
.tb .ic{display:block;font-size:1.25rem}
.tb.on{color:#fff;border-top-color:#22d3ee;text-shadow:0 0 8px #22d3ee}
:root{--lf:sans-serif;--ls:1.05rem;--la:#fff;--li:#c4c4dc;--lg:#ff2fa0;--lgb:12px;--lm:12px;--lal:center;--lw:700;--lst:0px;--ml:auto;--mr:auto;--p:0%;--bass:0}
.lyric-line{font-family:var(--lf);font-size:var(--ls);color:var(--li);margin:var(--lm) 0;line-height:1.4;text-align:var(--lal);text-shadow:0 1px 6px #000;transition:all .25s}
.lyric-line.active{color:var(--la);font-size:calc(var(--ls) * 1.25);font-weight:var(--lw);text-shadow:0 0 var(--lgb) var(--lg),0 0 calc(var(--lgb) * 2) var(--lg);-webkit-text-stroke:var(--lst) var(--lg)}
[data-anim=soft] .lyric-line.active{animation:lsoft .5s ease}
[data-anim=zoom] .lyric-line.active{animation:lzoom .45s cubic-bezier(.3,1.6,.5,1)}
[data-anim=slide] .lyric-line.active{animation:lslide .45s ease}
[data-anim=neon] .lyric-line.active{animation:lneon 1.4s infinite}
[data-anim=bass] .lyric-line.active{transform:scale(calc(1 + var(--bass) * .18));transition:transform .06s}
[data-anim=karaoke] .lyric-line.active{width:fit-content;max-width:100%;margin-left:var(--ml);margin-right:var(--mr);background:linear-gradient(90deg,var(--la) var(--p),var(--li) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;-webkit-text-stroke:0;filter:drop-shadow(0 0 calc(var(--lgb) / 2) var(--lg))}
@keyframes lsoft{from{opacity:.3;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes lzoom{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes lslide{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes lneon{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:1}55%{opacity:.7}}
#lypv{height:24vh;flex:none;overflow:hidden;border-radius:12px;border:1px solid #35354f;margin-bottom:8px;display:flex;flex-direction:column;justify-content:center;padding:0 14px;background:linear-gradient(rgba(0,0,0,var(--dim)),rgba(0,0,0,calc(var(--dim) + .18))),var(--bg) center/cover}
</style>
</head>
<body>
<div id="tab-player" class="tab on">
<div id="logo" class="band"><img src="img/logo.jpg" alt="JV Music 2.0"></div>
<div id="stage"><canvas id="viz"></canvas><div id="lyrics-container"><p class="lyric-line active">Toque em Biblioteca para escolher uma música</p></div></div>
<div id="card" class="band"><img src="img/card.jpg" alt=""><div id="info"><div id="t">Nome da Música</div><div id="a">Artista desconhecido</div><div id="b">Álbum desconhecido</div></div></div>
<div id="prog"><span id="cur">00:00</span><input class="nr" id="seek" type="range" min="0" max="1000" value="0"><span id="dur">00:00</span></div>
<div id="ctrl" class="band"><img src="img/controls.jpg" alt=""><svg id="pp" viewBox="0 0 24 24" fill="#e8fbff"></svg><div id="pl">Reproduzir</div></div>
</div>
<audio id="audio"></audio>
<input type="file" id="mp3-file" accept="audio/*">
<input type="file" id="lrc-file" accept=".lrc,text/plain">
<input type="file" id="bg-file" accept="image/*">
<div id="studio"><div class="lib-top"><b id="st-title">Estúdio visual</b></div>
<div id="pvbox"><canvas id="pv"></canvas></div><div id="st-body"></div></div>
<div id="library">
  <div class="lib-top"><input id="lib-search" type="search" placeholder="Buscar música ou artista"><button id="lib-file">Arquivo</button><button id="lib-close">Fechar</button></div>
  <div id="lib-count"></div><div id="lib-list"></div>
</div>
<div id="tab-lyrics" class="tab" style="padding:12px 16px"><div class="lib-top"><b style="flex:1;align-self:center;color:#22d3ee">Letras .LRC</b></div><div id="lypv"></div><div id="ly-body" style="flex:1;overflow-y:auto"></div></div>
<div id="tabs"><button class="tb on" data-t="player"><span class="ic">🎵</span>Player</button><button class="tb" data-t="visual"><span class="ic">✨</span>Visual</button><button class="tb" data-t="lyrics"><span class="ic">📝</span>Letras</button></div>
<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), lyricsBox = $('lyrics-container'), panel = $('library'), libList = $('lib-list'), libCount = $('lib-count'), libSearch = $('lib-search'), seek = $('seek');
let lyricsData = [], lastActive = -1, library = [], queue = [], qi = -1;

/* Botões: áreas da imagem (x0,x1,y0,y1 na arte original 941 px; faixa começa em y=1090, altura 410) */
const HS = {lib:[22,192,1118,1295], prev:[203,360,1125,1295], play:[368,578,1090,1340], next:[585,745,1125,1295],
  lrc:[755,925,1118,1295], aud:[30,225,1335,1495], minus:[330,375,1395,1455], plus:[630,680,1395,1455], volp:[715,915,1335,1495]};
const ACT = {lib:openLibrary, prev:()=>step(-1), next:()=>step(1), play:toggle, lrc:()=>$('lrc-file').click(),
  aud:()=>openStudio(), minus:()=>setVol(-.1), plus:()=>setVol(.1), volp:()=>setVol(.1)};
const place = (el, [x0,x1,y0,y1]) => { el.style.left = x0/9.41+'%'; el.style.width = (x1-x0)/9.41+'%'; el.style.top = (y0-1090)/4.1+'%'; el.style.height = (y1-y0)/4.1+'%'; };
for (const k in ACT) { const b = document.createElement('button'); b.className = 'hs'; place(b, HS[k]); b.onclick = ACT[k]; $('ctrl').appendChild(b); }
const vw = document.createElement('div'); vw.className = 'hsw'; place(vw, [385,622,1395,1455]);
vw.innerHTML = '<input class="nr" id="vol" type="range" min="0" max="1" step="0.01" value="1">'; $('ctrl').appendChild(vw);
$('vol').oninput = e => audio.volume = +e.target.value;
function setVol(d) { audio.volume = Math.min(1, Math.max(0, audio.volume + d)); $('vol').value = audio.volume; }

const PAUSE = '<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>', PLAY = '<path d="M8 4l13 8-13 8z"/>';
function upd() { $('pp').innerHTML = audio.paused ? PLAY : PAUSE; $('pl').textContent = audio.paused ? 'Reproduzir' : 'Pausar'; }
function toggle() { if (!audio.src) return openLibrary(); audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
audio.addEventListener('play', upd); audio.addEventListener('pause', upd); upd();

const fmt = t => isFinite(t) ? String(Math.floor(t/60)).padStart(2,'0') + ':' + String(Math.floor(t%60)).padStart(2,'0') : '00:00';
audio.addEventListener('loadedmetadata', () => $('dur').textContent = fmt(audio.duration));
seek.oninput = () => { if (audio.duration) audio.currentTime = seek.value/1000*audio.duration; };
function step(d) { if (!queue.length) return; qi = (qi + d + queue.length) % queue.length; playItem(queue[qi]); }
audio.addEventListener('ended', () => step(1));
function setInfo(t, a, b) { $('t').textContent = t; $('a').textContent = a || 'Artista desconhecido'; $('b').textContent = b || 'Álbum desconhecido'; }

/* Arquivo avulso */
$('mp3-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  queue = []; resetLyrics(); audio.src = URL.createObjectURL(f);
  setInfo(f.name.replace(/\.[^/.]+$/, '')); audio.play();
});
$('lrc-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => parseLRC(ev.target.result); r.readAsText(f);
});

/* Biblioteca */
const getPlugin = () => { const p = (window.Capacitor && window.Capacitor.Plugins) || {}; return p.CapacitorMediaStore || p.MediaStore || null; };
function showMsg(text) { libList.innerHTML = ''; const p = document.createElement('div'); p.className = 'lib-msg'; p.textContent = text; libList.appendChild(p); }
function extractList(res) {
  if (Array.isArray(res)) return res; if (!res) return [];
  for (const k of ['medias','media','files','items','audio','data']) if (Array.isArray(res[k])) return res[k];
  return Object.values(res).find(Array.isArray) || [];
}
const itemPath = it => it.uri || it.contentUri || it.path || it.filePath || it.data || '';
const itemTitle = it => it.title || it.name || it.displayName || 'Sem título';
async function openLibrary() {
  panel.classList.add('open'); libCount.textContent = ''; showMsg('Carregando músicas...');
  const MS = getPlugin();
  if (!MS) { showMsg('Plugin de músicas não encontrado.\nPlugins: ' + Object.keys((window.Capacitor && window.Capacitor.Plugins) || {}).join(', ')); return; }
  try {
    await MS.requestPermissions({ types: ['audio'] });
    const res = await MS.getMediasByType({ mediaType: 'audio', sortBy: 'TITLE', includeExternal: true });
    library = extractList(res);
    if (!library.length) { showMsg('Nenhuma música encontrada. Resposta:\n' + JSON.stringify(res).slice(0, 400)); return; }
    renderLibrary();
  } catch (err) { showMsg('Erro ao ler as músicas:\n' + (err && err.message ? err.message : JSON.stringify(err))); }
}
function renderLibrary() {
  const q = libSearch.value.trim().toLowerCase();
  const found = library.filter(it => !q || (itemTitle(it) + ' ' + (it.artist || '')).toLowerCase().includes(q));
  libCount.textContent = found.length + ' de ' + library.length + ' músicas';
  libList.innerHTML = '';
  found.slice(0, 500).forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'song';
    const t = document.createElement('div'); t.className = 'song-title'; t.textContent = itemTitle(it);
    const s = document.createElement('div'); s.className = 'song-sub'; s.textContent = [it.artist, it.album].filter(Boolean).join(' - ');
    row.append(t, s);
    row.addEventListener('click', () => { queue = found; qi = i; playItem(it); });
    libList.appendChild(row);
  });
}
function playItem(it) {
  const path = itemPath(it);
  if (!path) { panel.classList.add('open'); showMsg('Sem caminho para esta música:\n' + JSON.stringify(it).slice(0, 400)); return; }
  resetLyrics();
  audio.src = /^https?:/.test(path) ? path : window.Capacitor.convertFileSrc(path);
  setInfo(itemTitle(it), it.artist, it.album);
  panel.classList.remove('open');
  audio.play().catch(() => {});
  tryAutoLrc(path);
}
audio.addEventListener('error', () => { if (audio.src && !audio.src.startsWith('blob:')) $('t').textContent = 'Erro ao tocar'; });
function tryAutoLrc(path) {
  if (!/\.[^/.\\]+$/.test(path)) return;
  fetch(window.Capacitor.convertFileSrc(path.replace(/\.[^/.\\]+$/, '.lrc')))
    .then(r => r.ok ? r.text() : Promise.reject()).then(parseLRC).catch(() => {});
}
libSearch.addEventListener('input', renderLibrary);
$('lib-close').addEventListener('click', () => panel.classList.remove('open'));

/* Letras */
function resetLyrics() { lyricsData = []; lastActive = -1; lyricsBox.innerHTML = '<p class="lyric-line active">Carregue o .LRC para ver a letra</p>'; }
function parseLRC(text) {
  lyricsData = []; lastActive = -1;
  const re = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
  text.split(/\r?\n/).forEach(line => {
    const m = re.exec(line); if (!m) return;
    const time = +m[1]*60 + +m[2] + parseInt(m[3], 10) / (m[3].length === 3 ? 1000 : 100);
    const t = line.replace(re, '').trim(); if (t) lyricsData.push({ time, text: t });
  });
  lyricsData.sort((a, b) => a.time - b.time);
  lyricsBox.innerHTML = lyricsData.length
    ? lyricsData.map((l, i) => `<p id="line-${i}" class="lyric-line">${l.text.replace(/</g, '&lt;')}</p>`).join('')
    : '<p class="lyric-line active">Nenhuma linha sincronizada encontrada</p>';
}
audio.addEventListener('timeupdate', () => {
  const c = audio.currentTime;
  $('cur').textContent = fmt(c);
  if (audio.duration) seek.value = c / audio.duration * 1000;
  let a = -1;
  for (let i = 0; i < lyricsData.length && lyricsData[i].time <= c; i++) a = i;
  if (a !== -1 && a !== lastActive) {
    lastActive = a;
    document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
    const el = $('line-' + a);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
});

/* Sound bars que reagem à música */
let ac = null, an = null, fd = null;
function initViz() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaElementSource(audio);
      an = ac.createAnalyser(); an.fftSize = 128; an.smoothingTimeConstant = .75;
      src.connect(an); an.connect(ac.destination);
      fd = new Uint8Array(an.frequencyBinCount);
    } catch (e) { ac = null; an = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
audio.addEventListener('play', initViz);
const cv = $('viz'), pv = $('pv'), studio = $('studio'), sb = $('st-body'), lv = new Array(64).fill(0);
const DEF = {style:'blocks', pal:'neon', c1:'#22d3ee', c2:'#ff2fa0', gain:1, fall:.04, n:32, thick:.66, glow:8, dim:.5, bg:''};
let cfg = Object.assign({}, DEF);
try { Object.assign(cfg, JSON.parse(localStorage.getItem('jvviz') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('jvviz', JSON.stringify(cfg)); } catch (e) {} };
const PALS = {neon:['#22d3ee','#a855f7','#ff2fa0'], fogo:['#ffe14d','#ff7a18','#ff2d2d'], verde:['#a3ff12','#19d46b','#00b3a4'], arco:['#ff2d2d','#ffd23f','#3bff7a','#22d3ee','#a855f7']};
const STYLES = {blocks:'Blocos', mirror:'Espelhadas', wave:'Onda', fill:'Preenchido', circle:'Circular', dots:'Pontos'};
function applyBg() { const r = document.documentElement.style; r.setProperty('--bg', 'url("' + (cfg.bg || 'img/bg.jpg') + '")'); r.setProperty('--dim', cfg.dim); }

function render(c) {
  const cx = c.getContext('2d'), w = c.width = c.clientWidth, h = c.height = c.clientHeight, n = cfg.n;
  cx.clearRect(0, 0, w, h);
  const st = cfg.pal === 'custom' ? [cfg.c1, cfg.c2] : (PALS[cfg.pal] || PALS.neon);
  const g = cx.createLinearGradient(0, 0, w, 0);
  st.forEach((col, i) => g.addColorStop(i / (st.length - 1), col));
  cx.fillStyle = g; cx.strokeStyle = g; cx.shadowBlur = cfg.glow; cx.shadowColor = st[Math.floor(st.length / 2)]; cx.lineCap = 'round';
  const V = i => lv[Math.floor(i * 56 / n)], gap = w / n, bw = gap * cfg.thick;
  if (cfg.style === 'blocks') {
    for (let i = 0; i < n; i++) { const k = Math.max(1, Math.round(V(i) * h / 6)); for (let b = 0; b < k; b++) cx.fillRect(i * gap + (gap - bw) / 2, h - (b + 1) * 6, bw, 4); }
  } else if (cfg.style === 'mirror') {
    for (let i = 0; i < n; i++) { const bh = Math.max(2, V(i) * h * .9); cx.fillRect(i * gap + (gap - bw) / 2, (h - bh) / 2, bw, bh); }
  } else if (cfg.style === 'wave' || cfg.style === 'fill') {
    cx.beginPath();
    for (let i = 0; i < n; i++) { const x = i * gap + gap / 2, y = h - Math.max(2, V(i) * h * .9); i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
    if (cfg.style === 'fill') { cx.lineTo(w, h); cx.lineTo(0, h); cx.closePath(); cx.globalAlpha = .8; cx.fill(); cx.globalAlpha = 1; }
    else { cx.lineWidth = 3; cx.stroke(); }
  } else if (cfg.style === 'circle') {
    const m = Math.min(w, h), R = m * .22, L = m * .3;
    cx.lineWidth = Math.max(2, 2 * Math.PI * R / n * cfg.thick);
    for (let i = 0; i < n; i++) {
      const a = i / n * 2 * Math.PI - Math.PI / 2, len = Math.max(2, V(i) * L);
      cx.beginPath(); cx.moveTo(w / 2 + Math.cos(a) * R, h / 2 + Math.sin(a) * R); cx.lineTo(w / 2 + Math.cos(a) * (R + len), h / 2 + Math.sin(a) * (R + len)); cx.stroke();
    }
  } else {
    for (let i = 0; i < n; i++) { const r = Math.min(h / 2, Math.max(2, gap * .5 * cfg.thick + V(i) * gap * 1.2)); cx.beginPath(); cx.arc(i * gap + gap / 2, h / 2, r, 0, 7); cx.fill(); }
  }
}
function loop(t) {
  requestAnimationFrame(loop);
  lyrLoop(t);
  const playing = !audio.paused;
  if (an && playing) an.getByteFrequencyData(fd);
  for (let j = 0; j < 64; j++) {
    const raw = !playing ? 0 : an ? Math.min(1, fd[j] / 255 * cfg.gain) : .3 + .5 * Math.abs(Math.sin(t / 300 + j));
    lv[j] = Math.max(raw, lv[j] - cfg.fall);
  }
  if ($('tab-player').classList.contains('on')) render(cv);
  if (studio.classList.contains('open')) render(pv);
}

/* Estúdio visual */
function openStudio() { showTab('visual'); initViz(); }
function buildStudio() {
  const y = sb.scrollTop; sb.innerHTML = '';
  const add = (title, node) => { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<label><span>' + title + '</span><span></span></label>'; d.appendChild(node); sb.appendChild(d); return d; };
  const chips = (title, items, key) => {
    const c = document.createElement('div'); c.className = 'chips';
    for (const k in items) { const b = document.createElement('div'); b.className = 'chip' + (cfg[key] === k ? ' on' : ''); b.textContent = items[k]; b.onclick = () => { cfg[key] = k; save(); buildStudio(); }; c.appendChild(b); }
    add(title, c);
  };
  chips('Forma', STYLES, 'style');
  chips('Cores', {neon:'Neon', fogo:'Fogo', verde:'Verde', arco:'Arco-íris', custom:'Minhas cores'}, 'pal');
  if (cfg.pal === 'custom') {
    const d = document.createElement('div');
    [['c1'], ['c2']].forEach(([k]) => { const i = document.createElement('input'); i.type = 'color'; i.value = cfg[k]; i.oninput = () => { cfg[k] = i.value; save(); }; d.appendChild(i); });
    add('Cor inicial e final', d);
  }
  [['gain','Sensibilidade',.3,3,.1], ['fall','Queda suave',.01,.15,.01], ['n','Quantidade',12,64,1], ['thick','Espessura',.25,.95,.05], ['glow','Brilho',0,25,1], ['dim','Escurecer fundo',0,.85,.05]].forEach(([k, l, mn, mx, s]) => {
    const i = document.createElement('input'); i.type = 'range'; i.className = 'nr'; i.min = mn; i.max = mx; i.step = s; i.value = cfg[k];
    const row = add(l, i), val = row.querySelector('label span:last-child'); val.textContent = cfg[k];
    i.oninput = () => { cfg[k] = +i.value; val.textContent = cfg[k]; if (k === 'dim') applyBg(); save(); };
  });
  const bt = document.createElement('div'); bt.className = 'chips';
  [['Trocar imagem de fundo', () => $('bg-file').click()], ['Fundo padrão', () => { cfg.bg = ''; applyBg(); save(); }], ['Restaurar tudo', () => { cfg = Object.assign({}, DEF); applyBg(); save(); buildStudio(); }]].forEach(([t, f]) => { const b = document.createElement('div'); b.className = 'chip'; b.textContent = t; b.onclick = f; bt.appendChild(b); });
  add('Fundo e padrões', bt);
  sb.scrollTop = y;
}
$('bg-file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 720 / img.width), c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cfg.bg = c.toDataURL('image/jpeg', .8); applyBg(); save(); URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};
$('lib-file').onclick = () => $('mp3-file').click();
applyBg(); requestAnimationFrame(loop);
function showTab(n) {
  $('tab-player').classList.toggle('on', n === 'player');
  studio.classList.toggle('open', n === 'visual');
  $('tab-lyrics').classList.toggle('on', n === 'lyrics');
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  if (n === 'visual') { buildStudio(); initViz(); }
  if (n === 'lyrics') buildLyr();
}
document.querySelectorAll('.tb').forEach(b => b.onclick = () => showTab(b.dataset.t));

/* Letras: fonte, cor e animação */
const LD = {font:'sans-serif', size:1.05, lh:12, align:'center', w:'700', pal:'rosa', ca:'#ffffff', ci:'#c4c4dc', cg:'#ff2fa0', glow:12, stroke:0, anim:'soft'};
let L = Object.assign({}, LD);
try { Object.assign(L, JSON.parse(localStorage.getItem('jvlyr') || '{}')); } catch (e) {}
const saveL = () => { try { localStorage.setItem('jvlyr', JSON.stringify(L)); } catch (e) {} };
const LPAL = {rosa:['#ffffff','#c4c4dc','#ff2fa0'], ciano:['#ffffff','#b8c7d9','#22d3ee'], dourado:['#fff3b0','#d9c9a0','#ff9f1a'], verde:['#eaffd0','#b8d9b0','#19d46b'], roxo:['#f3e8ff','#cbb8e8','#a855f7']};
const FONTS = {'sans-serif':'Normal','sans-serif-light':'Fina','sans-serif-black':'Pesada','sans-serif-condensed':'Condensada','serif':'Serifa','cursive':'Cursiva','monospace':'Mono','casual':'Casual'};
const ANIMS = {none:'Nenhuma', soft:'Suave', zoom:'Zoom', slide:'Deslizar', neon:'Neon piscando', karaoke:'Karaokê', bass:'Pulsar no grave'};
function applyLyr() {
  const r = document.documentElement, s = r.style, c = L.pal === 'custom' ? [L.ca, L.ci, L.cg] : (LPAL[L.pal] || LPAL.rosa);
  s.setProperty('--lf', L.font); s.setProperty('--ls', L.size + 'rem'); s.setProperty('--la', c[0]); s.setProperty('--li', c[1]); s.setProperty('--lg', c[2]);
  s.setProperty('--lgb', L.glow + 'px'); s.setProperty('--lm', L.lh + 'px'); s.setProperty('--lal', L.align); s.setProperty('--lw', L.w); s.setProperty('--lst', L.stroke + 'px');
  s.setProperty('--ml', L.align === 'left' ? '0' : 'auto'); s.setProperty('--mr', L.align === 'right' ? '0' : 'auto');
  r.dataset.anim = L.anim;
}
const lypv = $('lypv'); let pvI = -1;
['Cada batida é uma história', 'Cante comigo essa canção', 'Até o amanhecer chegar'].forEach(t => { const p = document.createElement('p'); p.className = 'lyric-line'; p.textContent = t; lypv.appendChild(p); });
function lyrLoop(t) {
  if (L.anim === 'karaoke' && lastActive >= 0 && lyricsData[lastActive]) {
    const a = lyricsData[lastActive], nx = lyricsData[lastActive + 1], d = Math.max(.5, (nx ? nx.time : a.time + 4) - a.time);
    lyricsBox.style.setProperty('--p', Math.min(100, Math.max(0, (audio.currentTime - a.time) / d * 100)) + '%');
  }
  if (L.anim === 'bass') lyricsBox.style.setProperty('--bass', (lv[0] + lv[1] + lv[2] + lv[3]) / 4);
  if ($('tab-lyrics').classList.contains('on')) {
    const i = Math.floor(t / 2600) % 3;
    if (i !== pvI) { pvI = i; [...lypv.children].forEach((e, j) => e.classList.toggle('active', j === i)); }
    lypv.style.setProperty('--p', (t % 2600) / 26 + '%'); lypv.style.setProperty('--bass', .5 + .5 * Math.sin(t / 180));
  }
}
function buildLyr() {
  const body = $('ly-body'), y = body.scrollTop; body.innerHTML = '';
  const add = (title, node) => { const d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<label><span>' + title + '</span><span></span></label>'; d.appendChild(node); body.appendChild(d); return d; };
  const chips = (title, items, key, fam) => {
    const c = document.createElement('div'); c.className = 'chips';
    for (const k in items) {
      const b = document.createElement('div'); b.className = 'chip' + (String(L[key]) === k ? ' on' : ''); b.textContent = items[k];
      if (fam) b.style.fontFamily = k;
      b.onclick = () => { L[key] = k; saveL(); applyLyr(); buildLyr(); }; c.appendChild(b);
    }
    add(title, c);
  };
  chips('Fonte', FONTS, 'font', true);
  chips('Peso', {400:'Normal', 700:'Negrito', 900:'Extra'}, 'w');
  chips('Alinhamento', {left:'Esquerda', center:'Centro', right:'Direita'}, 'align');
  chips('Cores', {rosa:'Rosa', ciano:'Ciano', dourado:'Dourado', verde:'Verde', roxo:'Roxo', custom:'Minhas cores'}, 'pal');
  if (L.pal === 'custom') {
    const d = document.createElement('div');
    ['ca', 'ci', 'cg'].forEach(k => { const i = document.createElement('input'); i.type = 'color'; i.value = L[k]; i.oninput = () => { L[k] = i.value; saveL(); applyLyr(); }; d.appendChild(i); });
    add('Linha ativa, inativas e brilho', d);
  }
  chips('Animação', ANIMS, 'anim');
  [['size','Tamanho',.8,2,.05], ['lh','Espaço entre linhas',4,30,1], ['glow','Brilho',0,30,1], ['stroke','Contorno',0,3,.5]].forEach(([k, l, mn, mx, s]) => {
    const i = document.createElement('input'); i.type = 'range'; i.className = 'nr'; i.min = mn; i.max = mx; i.step = s; i.value = L[k];
    const val = add(l, i).querySelector('label span:last-child'); val.textContent = L[k];
    i.oninput = () => { L[k] = +i.value; val.textContent = L[k]; saveL(); applyLyr(); };
  });
  const r = document.createElement('div'); r.className = 'chips';
  const b = document.createElement('div'); b.className = 'chip'; b.textContent = 'Restaurar padrão';
  b.onclick = () => { L = Object.assign({}, LD); saveL(); applyLyr(); buildLyr(); }; r.appendChild(b); add('Padrões', r);
  body.scrollTop = y;
}
applyLyr();
