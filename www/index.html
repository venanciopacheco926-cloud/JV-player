<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JV Music Player Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0d0d12; color: #f0f0f5; display: flex; flex-direction: column; height: 100vh; padding: 16px; }
        .header { text-align: center; padding: 10px 0; border-bottom: 1px solid #1f1f2e; }
        .header h1 { font-size: 1.1rem; color: #a855f7; letter-spacing: 1px; }
        #track-title { font-size: 0.85rem; color: #888899; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #lyrics-container { flex: 1; overflow-y: auto; padding: 30px 10px; text-align: center; scroll-behavior: smooth; }
        .lyric-line { font-size: 1.1rem; color: #555566; margin: 14px 0; transition: all 0.2s ease; line-height: 1.4; }
        .lyric-line.active { color: #ffffff; font-size: 1.35rem; font-weight: 700; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); transform: scale(1.02); }
        .controls-area { background: #161622; padding: 14px; border-radius: 14px; border: 1px solid #252538; }
        audio { width: 100%; height: 36px; margin-bottom: 10px; border-radius: 8px; }
        .file-buttons { display: flex; gap: 8px; }
        .btn-file { flex: 1; background: #252538; color: #e0e0e0; padding: 10px 4px; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1px solid #35354f; }
        .btn-file:active { background: #a855f7; color: #fff; }
        input[type="file"] { display: none; }

        #library { display: none; position: fixed; inset: 0; background: #0d0d12; flex-direction: column; padding: 16px; z-index: 10; }
        #library.open { display: flex; }
        .lib-top { display: flex; gap: 8px; margin-bottom: 10px; }
        #lib-search { flex: 1; background: #161622; color: #f0f0f5; border: 1px solid #35354f; border-radius: 8px; padding: 10px; font-size: 0.9rem; }
        #lib-close { background: #252538; color: #e0e0e0; border: 1px solid #35354f; border-radius: 8px; padding: 0 14px; font-size: 0.9rem; }
        #lib-count { font-size: 0.75rem; color: #888899; margin-bottom: 8px; }
        #lib-list { flex: 1; overflow-y: auto; }
        .song { padding: 10px 6px; border-bottom: 1px solid #1f1f2e; }
        .song:active { background: #252538; }
        .song-title { font-size: 0.95rem; color: #f0f0f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-sub { font-size: 0.75rem; color: #888899; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lib-msg { padding: 20px 6px; font-size: 0.85rem; color: #bbbbcc; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div class="header">
        <h1>JV MUSIC PLAYER</h1>
        <div id="track-title">Selecione uma faixa</div>
    </div>

    <div id="lyrics-container">
        <p class="lyric-line active">Carregue o Áudio e o .LRC para começar</p>
    </div>

    <div class="controls-area">
        <audio id="audio" controls></audio>
        <div class="file-buttons">
            <div class="btn-file" id="btn-library">📚 Biblioteca</div>
            <label class="btn-file">
                🎵 Áudio
                <input type="file" id="mp3-file" accept="audio/*">
            </label>
            <label class="btn-file">
                📝 Legenda .LRC
                <input type="file" id="lrc-file" accept=".lrc,text/plain">
            </label>
        </div>
    </div>

    <div id="library">
        <div class="lib-top">
            <input id="lib-search" type="search" placeholder="Buscar música ou artista">
            <button id="lib-close">Fechar</button>
        </div>
        <div id="lib-count"></div>
        <div id="lib-list"></div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics-container');
        const trackTitle = document.getElementById('track-title');
        const panel = document.getElementById('library');
        const libList = document.getElementById('lib-list');
        const libCount = document.getElementById('lib-count');
        const libSearch = document.getElementById('lib-search');
        let lyricsData = [];
        let lastActiveIndex = -1;
        let library = [];

        /* ---------- Escolher um arquivo (como antes) ---------- */
        document.getElementById('mp3-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            resetLyrics();
            audio.src = URL.createObjectURL(file);
            trackTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
            audio.play();
        });

        document.getElementById('lrc-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { parseLRC(event.target.result); };
            reader.readAsText(file);
        });

        /* ---------- Biblioteca do aparelho ---------- */
        function getPlugin() {
            const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
            return plugins.CapacitorMediaStore || plugins.MediaStore || null;
        }

        function showMsg(text) {
            libList.innerHTML = '';
            const p = document.createElement('div');
            p.className = 'lib-msg';
            p.textContent = text;
            libList.appendChild(p);
        }

        function extractList(res) {
            if (Array.isArray(res)) return res;
            if (!res) return [];
            for (const k of ['medias', 'media', 'files', 'items', 'audio', 'data']) {
                if (Array.isArray(res[k])) return res[k];
            }
            return Object.values(res).find(Array.isArray) || [];
        }

        function itemPath(it) {
            return it.uri || it.contentUri || it.path || it.filePath || it.data || '';
        }

        function itemTitle(it) {
            return it.title || it.name || it.displayName || 'Sem título';
        }

        async function openLibrary() {
            panel.classList.add('open');
            libCount.textContent = '';
            showMsg('Carregando músicas...');
            const MS = getPlugin();
            if (!MS) {
                const names = Object.keys((window.Capacitor && window.Capacitor.Plugins) || {}).join(', ');
                showMsg('Plugin de músicas não encontrado.\nPlugins disponíveis: ' + (names || 'nenhum'));
                return;
            }
            try {
                await MS.requestPermissions({ types: ['audio'] });
                const res = await MS.getMediasByType({ mediaType: 'audio', sortBy: 'TITLE', includeExternal: true });
                library = extractList(res);
                if (!library.length) {
                    showMsg('Nenhuma música encontrada. Resposta do plugin:\n' + JSON.stringify(res).slice(0, 400));
                    return;
                }
                renderLibrary();
            } catch (err) {
                showMsg('Erro ao ler as músicas:\n' + (err && err.message ? err.message : JSON.stringify(err)));
            }
        }

        function renderLibrary() {
            const q = libSearch.value.trim().toLowerCase();
            const found = library.filter(it =>
                !q || (itemTitle(it) + ' ' + (it.artist || '')).toLowerCase().includes(q));
            libCount.textContent = found.length + ' de ' + library.length + ' músicas';
            libList.innerHTML = '';
            found.slice(0, 500).forEach(it => {
                const row = document.createElement('div');
                row.className = 'song';
                const t = document.createElement('div');
                t.className = 'song-title';
                t.textContent = itemTitle(it);
                const s = document.createElement('div');
                s.className = 'song-sub';
                s.textContent = [it.artist, it.album].filter(Boolean).join(' - ');
                row.appendChild(t);
                row.appendChild(s);
                row.addEventListener('click', () => playItem(it));
                libList.appendChild(row);
            });
        }

        function playItem(it) {
            const path = itemPath(it);
            if (!path) {
                showMsg('Não encontrei o caminho desta música. Dados do item:\n' + JSON.stringify(it).slice(0, 400));
                return;
            }
            resetLyrics();
            const src = /^https?:/.test(path) ? path : window.Capacitor.convertFileSrc(path);
            audio.src = src;
            trackTitle.textContent = itemTitle(it);
            panel.classList.remove('open');
            audio.play().catch(() => {});
            tryAutoLrc(path);
        }

        audio.addEventListener('error', () => {
            if (audio.src && !audio.src.startsWith('blob:')) {
                trackTitle.textContent = 'Erro ao tocar: ' + decodeURIComponent(audio.src).slice(-60);
            }
        });

        function tryAutoLrc(path) {
            if (!/\.[^/.\\]+$/.test(path)) return;
            const lrcPath = path.replace(/\.[^/.\\]+$/, '.lrc');
            fetch(window.Capacitor.convertFileSrc(lrcPath))
                .then(r => r.ok ? r.text() : Promise.reject())
                .then(parseLRC)
                .catch(() => {});
        }

        document.getElementById('btn-library').addEventListener('click', openLibrary);
        document.getElementById('lib-close').addEventListener('click', () => panel.classList.remove('open'));
        libSearch.addEventListener('input', renderLibrary);

        /* ---------- Letras ---------- */
        function resetLyrics() {
            lyricsData = [];
            lastActiveIndex = -1;
            lyricsContainer.innerHTML = '<p class="lyric-line active">Carregue o .LRC para ver a letra</p>';
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split(/\r?\n/);
            lyricsData = [];
            lastActiveIndex = -1;
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const minutes = parseInt(match[1], 10);
                    const seconds = parseInt(match[2], 10);
                    const msPart = match[3];
                    const milliseconds = parseInt(msPart, 10) / (msPart.length === 3 ? 1000 : 100);
                    const totalSeconds = (minutes * 60) + seconds + milliseconds;
                    const text = line.replace(timeReg, '').trim();
                    if (text) {
                        lyricsData.push({ time: totalSeconds, text: text });
                    }
                }
            });

            lyricsData.sort((a, b) => a.time - b.time);
            renderLyrics();
        }

        function renderLyrics() {
            if (lyricsData.length === 0) {
                lyricsContainer.innerHTML = '<p class="lyric-line active">Nenhuma linha sincronizada encontrada</p>';
                return;
            }
            lyricsContainer.innerHTML = lyricsData.map((item, index) =>
                `<p id="line-${index}" class="lyric-line">${item.text}</p>`
            ).join('');
        }

        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            let activeIndex = -1;

            for (let i = 0; i < lyricsData.length; i++) {
                if (lyricsData[i].time <= currentTime) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            if (activeIndex !== -1 && activeIndex !== lastActiveIndex) {
                lastActiveIndex = activeIndex;
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                const activeLine = document.getElementById(`line-${activeIndex}`);
                if (activeLine) {
                    activeLine.classList.add('active');
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });
    </script>
</body>
</html>
