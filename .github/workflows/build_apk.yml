name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Bulletproof SDK 36 Injection via Python One-Liner
        run: |
          python3 -c 'import re; p="android/app/build.gradle"; c=open(p,encoding="utf-8").read(); c=re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 36", c); c=re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 36", c); c=re.sub(r"compileSdk\s*=.*", "compileSdk = 36", c); c=re.sub(r"targetSdk\s*=.*", "compileSdk = 36", c); open(p,"w",encoding="utf-8").write(c)'
          echo "SDK 36 successfully injected."

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
