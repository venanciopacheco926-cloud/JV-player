name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npp_res=$(npx cap sync android)
          echo "$npp_res"

      - name: Bulletproof SDK 36 Injection via Clean Python Script
        run: |
          cat << 'PY_EOF' > fix_sdk.py
import re

file_path = "android/app/build.gradle"
with open(file_path, "r", encoding="utf-8") as f:
    content = f.read()

content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 36", content)
content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 36", content)
content = re.sub(r"compileSdk\s*=.*", "compileSdk = 36", content)
content = re.sub(r"targetSdk\s*=.*", "targetSdk = 36", content)

with open(file_path, "w", encoding="utf-8") as f:
    f.write(content)

print("Successfully injected SDK 36 via clean Python script.")
PY_EOF

          python3 fix_sdk.py

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
