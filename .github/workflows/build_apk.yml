name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Force Complete variables.gradle with SDK 36 and Test Versions
        run: |
          cat << 'VAR_EOF' > android/variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.9.0'
              androidxAppCompatVersion = '1.7.0'
              androidxCoreVersion = '1.15.0'
              androidxCustomtabsVersion = '1.3.0'
              androidxCoreSplashscreenVersion = '1.0.1'
              coreSplashScreenVersion = '1.0.1'
              androidxCoordinatorLayoutVersion = '1.3.0'
              androidxFragmentVersion = '1.8.0'
              androidxWebkitVersion = '1.12.0'
              androidxAnnotationVersion = '1.9.0'
              androidxProfileinstallerVersion = '1.4.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          VAR_EOF
          echo "Variables.gradle updated with junitVersion."

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
