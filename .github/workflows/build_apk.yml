name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Safe SDK 36 Injection into android block
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          new_lines = []
          in_android = False
          sdk_injected = False

          for line in lines:
              new_lines.append(line)
              if "android {" in line and not in_android:
                  in_android = True
              elif in_android and not sdk_injected:
                  # Injetar logo após a abertura do bloco android
                  new_lines.append("    compileSdkVersion 36\n")
                  new_lines.append("    targetSdkVersion 36\n")
                  sdk_injected = True

          # Se já existirem propriedades antigas, podemos limpá-las ou mantê-las (o Gradle dá prioridade à primeira)
          content = "".join(new_lines)
          # Remover duplicados de compileSdkVersion / targetSdkVersion se houver
          import re
          # Deixar apenas o primeiro compileSdkVersion/targetSdkVersion se o re.sub for seguro, ou confiar na injecção limpa
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Safe SDK injection completed.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
