name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Bulletproof SDK 36 Injection via Python
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            python3 -c '
            with open("android/app/build.gradle", "r") as f:
                content = f.read()
            
            # Substituir compileSdkVersion e targetSdkVersion independentemente do valor anterior
            import re
            content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 36", content)
            content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 36", content)
            content = re.sub(r"compileSdk\s*=.*", "compileSdk = 36", content)
            content = re.sub(r"targetSdk\s*=.*", "targetSdk = 36", content)
            
            with open("android/app/build.gradle", "w") as f:
                f.write(content)
            print("Successfully injected SDK 36 via Python script.")
            '
          else
            echo "Error: build.gradle not found!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
