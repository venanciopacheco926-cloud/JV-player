name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Clean and Correct Gradle SDK 36 Injection
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # Substituir qualquer linha antiga de compile/target SDK pelo formato limpo do Gradle
              if "compileSdkVersion" in line or "compileSdk =" in line or "compileSdk=" in line:
                  new_lines.append("    compileSdkVersion 36\n")
              elif "targetSdkVersion" in line or "targetSdk =" in line or "targetSdk=" in line:
                  new_lines.append("    targetSdkVersion 36\n")
              else:
                  new_lines.append(line)

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(new_lines)
          print("Clean SDK injection completed successfully.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
