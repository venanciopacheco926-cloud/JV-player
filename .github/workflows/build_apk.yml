name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Precise SDK 36 Injection in defaultConfig
        run: |
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Substituir dentro de defaultConfig se existir, ou injetar com atribuição correta
          import re
          # Garantir que compileSdk e targetSdk usam atribuição ou o formato correto
          content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion = 36", content)
          content = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion = 36", content)
          content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", content)
          content = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 36", content)

          # Se ainda assim o defaultConfig pedir targetSdkVersion sem sinal, vamos ajustar o bloco defaultConfig
          if "defaultConfig {" in content and "targetSdkVersion 36" not in content:
              content = content.replace("defaultConfig {", "defaultConfig {\n        compileSdk = 36\n        targetSdk = 36\n        minSdk = 22")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Precise SDK injection completed.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
