name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Update SDK versions to 36
        run: |
          cd android/app
          sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' build.gradle
          sed -i 's/targetSdkVersion 33/targetSdkVersion 36/g' build.gradle
          sed -i 's/compileSdk = 33/compileSdk = 36/g' build.gradle
          sed -i 's/targetSdk = 33/targetSdk = 36/g' build.gradle
          cd ../..

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
