name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Defuse Anti-Tank Mine (Force SDK 36 hardcoded in build.gradle)
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            # Substituir compileSdkVersion e targetSdkVersion por valores diretos 36
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' "$BUILD_FILE"
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' "$BUILD_FILE"
            sed -i 's/compileSdk =.*/compileSdk = 36/g' "$BUILD_FILE"
            sed -i 's/targetSdk =.*/targetSdk = 36/g' "$BUILD_FILE"
            
            # Garantir que se usar variáveis do rootProject, nós injetamos o valor 36 lá dentro ou substituímos a linha inteira
            sed -i 's/compileSdkVersion rootProject.hasProperty("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 33/compileSdkVersion 36/g' "$BUILD_FILE"
            sed -i 's/targetSdkVersion rootProject.hasProperty("targetSdkVersion") ? rootProject.ext.targetSdkVersion : 33/targetSdkVersion 36/g' "$BUILD_FILE"
            
            echo "Hardcoded SDK 36 directly into $BUILD_FILE"
          else
            echo "Error: build.gradle not found!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
