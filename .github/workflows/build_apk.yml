name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Clean and Fix SDK 36 Syntax in build.gradle
        run: |
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/targetSdk =.*/targetSdk = 36/g' android/app/build.gradle
          fi
          echo "SDK fixed cleanly to 36."

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
