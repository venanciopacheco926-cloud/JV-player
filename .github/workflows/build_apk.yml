name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Clean Fix for variables.gradle and SDK 36
        run: |
          # Criar o variables.gradle sem espaços iniciais nas linhas para evitar erros de parsing
          printf "ext {\n    minSdkVersion = 22\n    compileSdkVersion = 36\n    targetSdkVersion = 36\n    androidxActivityVersion = '1.11.0'\n    androidxAppCompatVersion = '1.7.1'\n    androidxCoreVersion = '1.17.0'\n    androidxCustomtabsVersion = '1.3.0'\n    androidxCoreSplashscreenVersion = '1.2.0'\n    coreSplashScreenVersion = '1.2.0'\n    androidxCoordinatorLayoutVersion = '1.3.0'\n    androidxFragmentVersion = '1.8.9'\n    androidxWebkitVersion = '1.14.0'\n    androidxAnnotationVersion = '1.4.1'\n    androidxProfileinstallerVersion = '1.4.0'\n    junitVersion = '4.13.2'\n    androidxJunitVersion = '1.2.1'\n    androidxEspressoCoreVersion = '3.6.1'\n    cordovaAndroidVersion = '10.1.1'\n}\n" > android/variables.gradle

          # Usar Python para garantir que o build.gradle não tem nenhuma linha corrompida e usa o SDK correto
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          import re
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 36", content)
          content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 36", content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Variables and build.gradle cleanly aligned.")
          '

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
